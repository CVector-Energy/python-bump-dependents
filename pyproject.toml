[project]
name = "python-bump-dependents-tests"
version = "0"
description = "Test harness for the scripts backing the python-bump-dependents action."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Nothing here is packaged; the action ships the scripts as files.
[tool.uv]
package = false
